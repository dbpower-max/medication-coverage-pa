name: Validate statewide provider reference
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_provider_site.py
      - run: python tools/verify_asset_versions.py
      - run: python tools/verify_ach_product_updates.py
      - run: python tools/verify_source_conflicts.py
      - run: python tools/verify_rxnorm_display_names.py
      - run: python tools/verify_structured_criteria.py
      - run: node tools/verify_structured_criteria_ui.cjs
      - run: node --check _site/app.js
      - run: node tools/verify_pa_column.cjs
      - run: node tools/verify_policy_source_branches.cjs
      - run: node tools/verify_medication_results.cjs
      - run: node tools/verify_compact_clinical_ui.cjs
      - run: node tools/verify_product_clinical_cards.cjs
      - run: node tools/verify_inhaler_filter.cjs
      - run: python tools/verify_uhc_policy_access.py
      - run: node tools/verify_uhc_clinical_ui.cjs
      - run: node tools/verify_medication_sort.cjs
      - run: python tools/verify_shared_policy_pilot.py
      - run: node tools/verify_medication_grouping.cjs
      - run: node tools/verify_statewide_provider.cjs
      - run: node tools/audit_live_clinical_guide_links.cjs
      - run: node tools/verify_statewide_library.cjs
