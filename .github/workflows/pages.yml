name: Publish provider app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_provider_site.py
      - run: python tools/verify_asset_versions.py
      - run: python tools/verify_ach_product_updates.py
      - run: python tools/verify_source_conflicts.py
      - run: python tools/verify_rxnorm_display_names.py
      - run: python tools/verify_structured_criteria.py
      - run: node tools/verify_structured_criteria_ui.cjs
      - run: node --check _site/app.js
      - run: node tools/verify_pa_column.cjs
      - run: node tools/verify_policy_source_branches.cjs
      - run: node tools/verify_medication_results.cjs
      - run: node tools/verify_compact_clinical_ui.cjs
      - run: node tools/verify_product_clinical_cards.cjs
      - run: node tools/verify_inhaler_filter.cjs
      - run: python tools/verify_uhc_policy_access.py
      - run: node tools/verify_uhc_clinical_ui.cjs
      - run: node tools/verify_medication_sort.cjs
      - run: python tools/verify_shared_policy_pilot.py
      - run: node tools/verify_medication_grouping.cjs
      - run: node tools/verify_statewide_provider.cjs
      - run: node tools/audit_live_clinical_guide_links.cjs
      - run: node tools/verify_statewide_library.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy uploaded Pages artifact
        id: deployment
        timeout-minutes: 12
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error('Pages upload did not return a valid artifact ID');
            }

            const oidcToken = await core.getIDToken();
            let deployment;
            try {
              ({ data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                ...context.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: oidcToken
              }));
            } catch (error) {
              throw new Error(`Pages rejected artifact ${artifactId} (HTTP ${error.status ?? 'unknown'})`);
            }

            const deploymentId = deployment.id || context.sha;
            const finalFailures = new Set([
              'deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost'
            ]);
            const deadline = Date.now() + 10 * 60 * 1000;
            let lastStatus = 'pending';
            while (Date.now() < deadline) {
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                  ...context.repo,
                  deployment_id: deploymentId,
                  headers: { 'cache-control': 'no-cache' }
                });
                lastStatus = data.status ?? 'unknown';
              } catch (error) {
                if (![404, 429, 500, 502, 503, 504].includes(error.status)) {
                  throw new Error(`Pages status lookup failed (HTTP ${error.status ?? 'unknown'})`);
                }
              }
              if (lastStatus === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                core.info(`Published artifact ${artifactId} for ${context.sha}`);
                return;
              }
              if (finalFailures.has(lastStatus)) {
                throw new Error(`Pages deployment ${deploymentId} reported ${lastStatus}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`Pages deployment ${deploymentId} timed out (${lastStatus})`);
