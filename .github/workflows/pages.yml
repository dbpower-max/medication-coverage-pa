name: Publish provider app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_provider_site.py
      - run: node --check _site/app.js
      - run: node tools/verify_pa_column.cjs
      - run: python tools/verify_shared_policy_pilot.py
      - run: node tools/verify_medication_grouping.cjs
      - run: node tools/verify_statewide_provider.cjs
      - run: node tools/audit_live_clinical_guide_links.cjs
      - run: node tools/verify_statewide_library.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded artifact
        uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let attempt = 0; attempt < 30; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, per_page: 100
              });
              const matches = result.data.artifacts.filter(a => a.name === name && !a.expired);
              if (matches.length === 1) return;
              if (matches.length > 1) throw new Error('Duplicate deployment artifact');
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Uploaded deployment artifact did not become available');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
